<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Workout Generator</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <link rel="stylesheet" href="./style.css"/>
</head>

<body class="app-body">

  <!-- HEADER -->
  <header class="app-header" style="display:flex; justify-content:space-between; align-items:center; padding:0 20px;">
    <a href="./Home.html" class="nav-btn" style="width:auto; padding:8px 14px;">⬅ Home</a>
    <h1 style="margin:auto;">WORKOUT GENERATOR</h1>
    <div style="width:60px;"></div>
  </header>

  <!-- SELECTION TABS -->
  <section class="tab-buttons">
    <button class="tab-btn active" onclick="selectGoal('strength')">Strength</button>
    <button class="tab-btn" onclick="selectGoal('fatloss')">Fat Loss</button>
    <button class="tab-btn" onclick="selectGoal('endurance')">Endurance</button>
    <button class="tab-btn" onclick="selectGoal('mobility')">Mobility</button>
  </section>

  <!-- DIFFICULTY -->
  <section class="tab-buttons">
    <button class="tab-btn active" onclick="selectDifficulty('beginner')">Beginner</button>
    <button class="tab-btn" onclick="selectDifficulty('intermediate')">Intermediate</button>
    <button class="tab-btn" onclick="selectDifficulty('advanced')">Advanced</button>
  </section>

  <!-- DURATION -->
  <section class="tab-buttons">
    <button class="tab-btn active" onclick="selectDuration(10)">10 min</button>
    <button class="tab-btn" onclick="selectDuration(20)">20 min</button>
    <button class="tab-btn" onclick="selectDuration(30)">30 min</button>
    <button class="tab-btn" onclick="selectDuration(45)">45 min</button>
  </section>

  <!-- MUSCLE GROUP GRID -->
  <section class="muscle-grid">
    <a class="muscle-btn" onclick="toggleMuscle(this,'Chest')">Chest</a>
    <a class="muscle-btn" onclick="toggleMuscle(this,'Back')">Back</a>
    <a class="muscle-btn" onclick="toggleMuscle(this,'Arms')">Arms</a>
    <a class="muscle-btn" onclick="toggleMuscle(this,'Core')">Core</a>
    <a class="muscle-btn" onclick="toggleMuscle(this,'Legs')">Legs</a>
    <a class="muscle-btn" onclick="toggleMuscle(this,'Glutes')">Glutes</a>
  </section>

  <!-- GENERATE BUTTON -->
  <div style="padding:20px; text-align:center;">
    <button class="auth-btn" onclick="generateWorkout()">Generate Workout</button>
  </div>

  <!-- OUTPUT -->
  <section id="output" class="workout-list"></section>

  <script>
    let selectedGoal = "strength";
    let selectedDifficulty = "beginner";
    let selectedDuration = 10;
    let selectedMuscles = [];

    function selectGoal(goal) {
      selectedGoal = goal;
      updateActiveButtons(event.target);
    }

    function selectDifficulty(level) {
      selectedDifficulty = level;
      updateActiveButtons(event.target);
    }

    function selectDuration(mins) {
      selectedDuration = mins;
      updateActiveButtons(event.target);
    }

    function toggleMuscle(btn, muscle) {
      btn.classList.toggle("active");
      if (selectedMuscles.includes(muscle)) {
        selectedMuscles = selectedMuscles.filter(m => m !== muscle);
      } else {
        selectedMuscles.push(muscle);
      }
    }

    function updateActiveButtons(btn) {
      const group = btn.parentElement.querySelectorAll(".tab-btn");
      group.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    }

    /* EXERCISE DATABASE */
    const exercises = {
      Chest: ["Push-Ups", "Incline Push-Ups", "Wide Push-Ups"],
      Back: ["Superman Holds", "Wall Angels", "Good Mornings"],
      Arms: ["Diamond Push-Ups", "Tricep Dips", "Fingertip Push-Ups"],
      Core: ["Crunches", "Leg Raises", "Plank"],
      Legs: ["Squats", "Lunges", "Jump Squats"],
      Glutes: ["Glute Bridge", "Donkey Kicks", "Fire Hydrants"]
    };

    function generateWorkout() {
      if (selectedMuscles.length === 0) {
        alert("Select at least one muscle group");
        return;
      }

      const output = document.getElementById("output");
      output.innerHTML = "";

      const gender = localStorage.getItem("gender");

      selectedMuscles.forEach(muscle => {
        const card = document.createElement("div");
        card.className = "workout-card";

        const exercise = exercises[muscle][Math.floor(Math.random() * exercises[muscle].length)];

        card.innerHTML = `
          <h2>${exercise}</h2>
          <img class="workout-img" src="./Images/${gender}${exercise.replace(/ /g,'')}.png">
          <p>${generateDescription(exercise)}</p>
        `;

        output.appendChild(card);
      });
    }

    function generateDescription(ex) {
      return `Complete this exercise for ${selectedDifficulty === "beginner" ? "30 sec" : selectedDifficulty === "intermediate" ? "45 sec" : "60 sec"} and repeat for ${selectedDuration / 10} rounds.`;
    }
  </script>

</body>
</html>
