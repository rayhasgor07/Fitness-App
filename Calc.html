<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Fitness Calculators</title>
  <link rel="stylesheet" href="./style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body class="app-body">

  <header class="app-header" style="display:flex;justify-content:space-between;align-items:center;padding:0 20px;">
    <a href="./Home.html" class="nav-btn" style="width:auto;padding:8px 16px;flex-direction:row;gap:6px;font-size:13px;">⬅ Home</a>
    <h1>Calculators</h1>
    <div style="width:80px;"></div>
  </header>

  <!-- TABS -->
  <div class="tab-buttons">
    <button class="tab-btn active" onclick="openTab('bmiTab', this)">BMI</button>
    <button class="tab-btn" onclick="openTab('calTab', this)">Calories</button>
    <button class="tab-btn" onclick="openTab('waterTab', this)">Water</button>
    <button class="tab-btn" onclick="openTab('macroTab', this)">Macros</button>
    <button class="tab-btn" onclick="openTab('idealTab', this)">Ideal Wt</button>
    <button class="tab-btn" onclick="openTab('bfTab', this)">Body Fat</button>
    <button class="tab-btn" onclick="openTab('ormTab', this)">1RM</button>
  </div>

  <div class="calc-container">

    <!-- BMI -->
    <section id="bmiTab" class="tab-content active-tab">
      <div class="calc-card">
        <h2>BMI Calculator</h2>
        <input id="bmiHeight" class="calc-input" type="number" placeholder="Height (cm)">
        <input id="bmiWeight" class="calc-input" type="number" placeholder="Weight (kg)">
        <button class="calc-btn" onclick="calculateBMI()">Calculate BMI</button>
        <div id="bmiResult" class="calc-result"></div>
      </div>
    </section>

    <!-- CALORIES -->
    <section id="calTab" class="tab-content">
      <div class="calc-card">
        <h2>Calorie Calculator</h2>
        <input id="age" class="calc-input" type="number" placeholder="Age">
        <input id="calHeight" class="calc-input" type="number" placeholder="Height (cm)">
        <input id="calWeight" class="calc-input" type="number" placeholder="Weight (kg)">
        <select id="activity" class="calc-input">
          <option value="1.2">Sedentary (desk job)</option>
          <option value="1.375">Light Exercise (1-3x/wk)</option>
          <option value="1.55">Moderate Exercise (3-5x/wk)</option>
          <option value="1.725">Heavy Exercise (6-7x/wk)</option>
          <option value="1.9">Athlete (2x/day)</option>
        </select>
        <button class="calc-btn" onclick="calculateCalories()">Calculate</button>
        <div id="calResult" class="calc-result"></div>
      </div>
    </section>

    <!-- WATER -->
    <section id="waterTab" class="tab-content">
      <div class="calc-card">
        <h2>Water Intake</h2>
        <input id="waterWeight" class="calc-input" type="number" placeholder="Weight (kg)">
        <select id="waterActivity" class="calc-input">
          <option value="0">Sedentary</option>
          <option value="0.3">Moderately Active</option>
          <option value="0.6">Very Active / Athlete</option>
        </select>
        <button class="calc-btn" onclick="calcWater()">Calculate</button>
        <div id="waterResult" class="calc-result"></div>
      </div>
    </section>

    <!-- MACROS -->
    <section id="macroTab" class="tab-content">
      <div class="calc-card">
        <h2>Macro Split</h2>
        <input id="macroCalories" class="calc-input" type="number" placeholder="Daily Calories (kcal)">
        <select id="macroGoal" class="calc-input">
          <option value="bulk">Bulking (muscle gain)</option>
          <option value="cut">Cutting (fat loss)</option>
          <option value="maintain">Maintenance</option>
        </select>
        <button class="calc-btn" onclick="calcMacros()">Calculate Macros</button>
        <div id="macroResult" class="calc-result"></div>
      </div>
    </section>

    <!-- IDEAL WEIGHT -->
    <section id="idealTab" class="tab-content">
      <div class="calc-card">
        <h2>Ideal Body Weight</h2>
        <input id="idealHeight" class="calc-input" type="number" placeholder="Height (cm)">
        <button class="calc-btn" onclick="calcIdealWeight()">Calculate</button>
        <div id="idealResult" class="calc-result"></div>
      </div>
    </section>

    <!-- BODY FAT (Navy Method) -->
    <section id="bfTab" class="tab-content">
      <div class="calc-card">
        <h2>Body Fat % (Navy)</h2>
        <input id="bfHeight" class="calc-input" type="number" placeholder="Height (cm)">
        <input id="bfWaist" class="calc-input" type="number" placeholder="Waist circumference (cm)">
        <input id="bfNeck" class="calc-input" type="number" placeholder="Neck circumference (cm)">
        <input id="bfHip" class="calc-input" type="number" placeholder="Hip circumference (cm) — women only">
        <button class="calc-btn" onclick="calcBodyFat()">Calculate</button>
        <div id="bfResult" class="calc-result"></div>
      </div>
    </section>

    <!-- ONE REP MAX -->
    <section id="ormTab" class="tab-content">
      <div class="calc-card">
        <h2>One Rep Max (1RM)</h2>
        <input id="ormWeight" class="calc-input" type="number" placeholder="Weight lifted (kg)">
        <input id="ormReps" class="calc-input" type="number" placeholder="Reps completed">
        <button class="calc-btn" onclick="calcORM()">Calculate 1RM</button>
        <div id="ormResult" class="calc-result"></div>
      </div>
    </section>

  </div><!-- /calc-container -->

  <script>
    function openTab(tabId, btn) {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active-tab');
      btn.classList.add('active');
    }

    function calculateBMI() {
      const h = +document.getElementById('bmiHeight').value;
      const w = +document.getElementById('bmiWeight').value;
      if (!h || !w) { document.getElementById('bmiResult').innerHTML = 'Enter height & weight'; return; }
      const bmi = (w / ((h/100)**2)).toFixed(1);
      const status = bmi < 18.5 ? 'Underweight' : bmi < 25 ? 'Normal ✓' : bmi < 30 ? 'Overweight' : 'Obese';
      document.getElementById('bmiResult').innerHTML = `BMI: <b>${bmi}</b><br>${status}`;
    }

    function calculateCalories() {
      const age = +document.getElementById('age').value;
      const h   = +document.getElementById('calHeight').value;
      const w   = +document.getElementById('calWeight').value;
      const act = +document.getElementById('activity').value;
      if (!age || !h || !w) { document.getElementById('calResult').innerHTML = 'Fill all fields'; return; }
      const gender = localStorage.getItem('gender');
      const BMR = gender === 'M'
        ? 88.36 + (13.4*w) + (4.8*h) - (5.7*age)
        : 447.6  + (9.2*w)  + (3.1*h) - (4.3*age);
      const TDEE = Math.round(BMR * act);
      document.getElementById('calResult').innerHTML =
        `Maintenance: <b>${TDEE} kcal</b><br>Cut: <b>${TDEE-500}</b> · Bulk: <b>${TDEE+300}</b>`;
    }

    function calcWater() {
      const w = +document.getElementById('waterWeight').value;
      const extra = +document.getElementById('waterActivity').value;
      if (!w) { document.getElementById('waterResult').innerHTML = 'Enter weight'; return; }
      const liters = (w * 0.033 + extra).toFixed(2);
      const cups   = Math.round(liters / 0.237);
      document.getElementById('waterResult').innerHTML =
        `<b>${liters} L</b> / day<br>${cups} cups`;
    }

    function calcMacros() {
      const cal  = +document.getElementById('macroCalories').value;
      const goal = document.getElementById('macroGoal').value;
      if (!cal) { document.getElementById('macroResult').innerHTML = 'Enter calories'; return; }
      let protPct, carbPct, fatPct;
      if (goal === 'bulk')     { protPct=0.30; carbPct=0.45; fatPct=0.25; }
      else if (goal === 'cut') { protPct=0.40; carbPct=0.30; fatPct=0.30; }
      else                     { protPct=0.30; carbPct=0.40; fatPct=0.30; }
      const prot = Math.round(cal * protPct / 4);
      const carb = Math.round(cal * carbPct / 4);
      const fat  = Math.round(cal * fatPct  / 9);
      document.getElementById('macroResult').innerHTML =
        `Protein: <b>${prot}g</b> · Carbs: <b>${carb}g</b> · Fat: <b>${fat}g</b>`;
    }

    function calcIdealWeight() {
      const h = +document.getElementById('idealHeight').value;
      if (!h) { document.getElementById('idealResult').innerHTML = 'Enter height'; return; }
      const gender = localStorage.getItem('gender') || 'M';
      const base   = gender === 'M' ? 50 : 45.5;
      const ideal  = (base + 0.9 * (h - 152.4)).toFixed(1);
      const lo     = (ideal * 0.9).toFixed(1);
      const hi     = (ideal * 1.1).toFixed(1);
      document.getElementById('idealResult').innerHTML =
        `Ideal: <b>${ideal} kg</b><br>Healthy range: ${lo}–${hi} kg`;
    }

    function calcBodyFat() {
      const gender = localStorage.getItem('gender') || 'M';
      const h     = +document.getElementById('bfHeight').value;
      const waist = +document.getElementById('bfWaist').value;
      const neck  = +document.getElementById('bfNeck').value;
      const hip   = +document.getElementById('bfHip').value;
      if (!h || !waist || !neck) { document.getElementById('bfResult').innerHTML = 'Fill required fields'; return; }
      let bf;
      if (gender === 'M') {
        bf = 495 / (1.0324 - 0.19077*Math.log10(waist - neck) + 0.15456*Math.log10(h)) - 450;
      } else {
        if (!hip) { document.getElementById('bfResult').innerHTML = 'Enter hip measurement'; return; }
        bf = 495 / (1.29579 - 0.35004*Math.log10(waist + hip - neck) + 0.22100*Math.log10(h)) - 450;
      }
      bf = bf.toFixed(1);
      const cat = bf < 10 ? 'Essential Fat' : bf < 20 ? 'Athletic' : bf < 25 ? 'Fitness' : bf < 30 ? 'Average' : 'Obese';
      document.getElementById('bfResult').innerHTML = `Body Fat: <b>${bf}%</b><br>${cat}`;
    }

    function calcORM() {
      const w = +document.getElementById('ormWeight').value;
      const r = +document.getElementById('ormReps').value;
      if (!w || !r) { document.getElementById('ormResult').innerHTML = 'Fill all fields'; return; }
      const orm = (w * (1 + r/30)).toFixed(1);
      document.getElementById('ormResult').innerHTML =
        `1RM: <b>${orm} kg</b><br>90%: ${(orm*0.9).toFixed(1)} · 80%: ${(orm*0.8).toFixed(1)} · 70%: ${(orm*0.7).toFixed(1)}`;
    }
  </script>
</body>
</html>
